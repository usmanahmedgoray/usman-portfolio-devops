
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit optimizations
      args:
        - NODE_ENV=production
      # Cache efficiently
      cache_from:
        - node:20-alpine
    container_name: portfolio
    image: portfolio:${TAG:-latest}
    
    # Port mapping
    ports:
      - "${PORT:-3000}:3000"
    
    # Command override (if needed)
    command: ["node", "server.js"]
    
    # Environment variables (use .env file)
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0  # ✅ YEH LINE ADD KAREIN (sabse important!)
    
    # Health check (using wget since curl not in alpine)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (prevent memory leaks)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration (prevent disk fill)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true  # Read-only root filesystem
    tmpfs:
      - /tmp:noexec,nosuid,size=50m  # Writable temp directory
    
    # Volume for persistent data (if needed)
    volumes:
      - uploads:/app/uploads  # Example: user uploads
    
    # Network mode
    networks:
      - app-network
    
    # Labels for monitoring/organization
    labels:
      - "com.docker.compose.project=portfolio"
      - "traefik.enable=true"  # If using Traefik
      - "traefik.http.routers.app.rule=Host(`yourdomain.com`)"

# Persistent volumes
volumes:
  uploads:
    driver: local

# Custom network
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16