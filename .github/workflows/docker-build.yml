# name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Docker Buildx setup karega (Advanced caching ke liye zaroori hai)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Niche 'my-app-name' ko apni marzi se change kar lein
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio:latest
          # Caching: Yeh agli builds ko super fast bana dega
          cache-from: type=gha
          cache-to: type=gha,mode=max
